name: Feature request
description: Propose an improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Several features are deliberately out of scope today; check the
        [roadmap](https://github.com/sadrax4/kvorum#roadmap) and the
        [design decisions](https://github.com/sadrax4/kvorum/tree/main/docs/adr) first.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to work on this?
      options:
        - "Yes, I can open a pull request"
        - "Maybe, with some guidance"
        - "No"
