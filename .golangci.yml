version: "2"

run:
  timeout: 10m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - intrange
    - misspell
    - nilerr
    - nolintlint
    - prealloc
    - revive
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
    - whitespace
  settings:
    gocritic:
      disabled-checks:
        - ifElseChain
        - singleCaseSwitch
    gosec:
      excludes:
        - G115 # integer overflow conversions are checked explicitly where they matter
        - G304 # file paths are constructed from operator-provided data directories
    revive:
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
            - disableStutteringCheck
        - name: package-comments
        - name: unused-parameter
          disabled: true
    staticcheck:
      checks:
        - all
        - -ST1000 # package comments are enforced by revive
  exclusions:
    generated: lax
    paths:
      - api/kvorumpb
      - api/raftpb
    rules:
      - path: _test\.go
        linters:
          - gosec
          - unparam
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/sadrax4/kvorum
  exclusions:
    paths:
      - api/kvorumpb
      - api/raftpb
